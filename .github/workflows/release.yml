name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write  # push container image to ghcr.io

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -race -count=1 -timeout 5m ./...

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o oqs-scanner-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/oqs-scanner/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oqs-scanner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: oqs-scanner-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum oqs-scanner-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/oqs-scanner-*
            dist/checksums.txt

      # Keep a floating major tag (v2 -> latest v2.x.y) so workflows can pin
      # `uses: jimbo111/open-quantum-secure@v2` and still receive fixes.
      - name: Update floating major tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"   # v2.1.0 -> v2
          if [ "$MAJOR" = "$GITHUB_REF_NAME" ]; then
            echo "Tag ${GITHUB_REF_NAME} has no minor/patch component — skipping floating tag"
            exit 0
          fi
          git tag -f "$MAJOR"
          git push origin "refs/tags/$MAJOR" --force

  docker:
    # Publishes the image consumed by the GitLab CI template
    # (.gitlab-ci-template.yml) and available for direct docker runs.
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
