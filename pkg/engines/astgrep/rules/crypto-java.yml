# Java JCA rules are value-generic: the $ALGO metavariable captures the actual
# algorithm string ("AES/CBC/PKCS5Padding", "RSA", "SHA256withRSA", ...), so
# metadata carries only the primitive. The wrapper prefers the captured value
# and never invents a static algorithm name for these rules.
rules:
  - id: crypto-java-cipher
    language: java
    rule:
      pattern: Cipher.getInstance($ALGO)
    message: "Java Cipher.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: symmetric

  - id: crypto-java-message-digest
    language: java
    rule:
      pattern: MessageDigest.getInstance($ALGO)
    message: "Java MessageDigest.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: hash

  - id: crypto-java-key-pair-generator
    language: java
    rule:
      pattern: KeyPairGenerator.getInstance($ALGO)
    message: "Java KeyPairGenerator.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: pke

  - id: crypto-java-key-generator
    language: java
    rule:
      pattern: KeyGenerator.getInstance($ALGO)
    message: "Java KeyGenerator.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: symmetric

  - id: crypto-java-secret-key-factory
    language: java
    rule:
      pattern: SecretKeyFactory.getInstance($ALGO)
    message: "Java SecretKeyFactory.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: symmetric

  - id: crypto-java-mac
    language: java
    rule:
      pattern: Mac.getInstance($ALGO)
    message: "Java Mac.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: mac

  - id: crypto-java-signature
    language: java
    rule:
      pattern: Signature.getInstance($ALGO)
    message: "Java Signature.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: signature

  - id: crypto-java-key-agreement
    language: java
    rule:
      pattern: KeyAgreement.getInstance($ALGO)
    message: "Java KeyAgreement.getInstance: $ALGO"
    severity: warning
    metadata:
      primitive: key-agree
